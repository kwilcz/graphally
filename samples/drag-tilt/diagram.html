<!doctype html>
<meta charset="utf-8">
<!-- Open this file in a browser to see the diagram. Edit the text and reload; the format: https://github.com/kwilcz/graphally -->
<script src="https://cdn.jsdelivr.net/gh/kwilcz/graphally@2/skills/graphally/viewer/graphally.min.js"></script>
<diagram width=820 title="A dragged card tilts with the pointer's speed, on a spring" subtitle="Drag right for 300 ms at 1.6 px a millisecond, stop, drag back: the card, and its angle against time, in step">
<!--
DESIGN
Point: designers tuning the drag see the tilt is a spring that follows the pointer's speed: a
  quick drag swings the card past its aim, a stop swings it back past level, and it never
  turns more than 4.5°.
Metaphor: a stage and its trace, played in step. The card is dragged on the stage above; its
  angle is traced against time below; a playhead and a dot riding the trace join the two, so
  the reader sees which part of the curve the card is living through. The still is the whole
  story: the card at rest, and the full trace with its three moments named.
Build: the stage in HTML (the cursor cut with clip-path); the spring model and its trace in the
  drawing script; animate() moves the card (sideways and turning), the cursor, the playhead
  and the dot on one 2.6 s loop, from the same simulation that draws the trace.
-->
<style>
  .stage { position: relative; height: 128px; margin: 4px 0 6px; }
  .card2 { position: absolute; left: 130px; top: 14px; width: 236px; padding: 12px 14px 11px; border: 1.2px solid var(--line); border-radius: 9px; background: var(--card); }
  .card2 b { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
  .card2 b i { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); }
  .card2 span { display: block; margin-top: 12px; font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
  /* The cursor: an arrow cut from a box, in the ink colour. */
  .cursor { position: absolute; left: 326px; top: 54px; width: 14px; height: 19px; background: var(--ink); clip-path: polygon(0 0, 0 78%, 26% 59%, 44% 91%, 62% 85%, 44% 54%, 79% 54%); }
  .floor { position: absolute; left: 110px; right: 40px; top: 104px; border-top: 1px solid var(--line); }
  .stage small { position: absolute; left: 110px; top: 110px; font-size: 11.5px; color: var(--muted); }
  .plot { height: 190px; margin: 40px 30px 50px 44px; }
</style>
<div class=stage>
  <div class=card2 id=card><b><i></i>Renew the TLS certificate</b><span>OPS-207</span></div>
  <div class=cursor id=cursor></div>
  <div class=floor></div>
  <small>drawn at a quarter of the distance; the card turns about a point half way across and a fifth of the way down</small>
</div>
<div class=plot id=plot></div>
<script type="graphally">
// The model, as engineering built it: the pointer's speed over the last 50 ms sets the angle the
// card aims at (3.4° at 1.2 px/ms or more, less for slower); the angle follows that aim as a
// spring (stiffness 900, damping 20, mass 1) and never turns past 4.5°.
const T = 2600, aim = [], ang = [], at = [];
const speed = t => (t >= 300 && t < 600 ? 1.6 : t >= 1400 && t < 1700 ? -1.6 : 0);
let a = 0, v = 0, x = 0;
for (let t = 0; t <= T; t++) {
  let s = 0; for (let u = Math.max(0, t - 49); u <= t; u++) s += speed(u); s /= 50;
  const target = Math.sign(s) * 3.4 * Math.min(1, Math.abs(s) / 1.2);
  for (let k = 0; k < 4; k++) { v += (900 * (target - a) - 20 * v) * 0.00025; a = Math.max(-4.5, Math.min(4.5, a + v * 0.00025)); }
  x += speed(t);
  aim.push(target); ang.push(a); at.push(x / 4);   // the stage shows a quarter of the distance
}
const P = el('plot'), X = t => P.x + P.w * t / T, Y = d => P.y + P.h / 2 - d * (P.h / 2 - 7) / 4.5;

// The trace: when the pointer moves, the grid, the aim (dashed) and the card's angle.
for (const [t0, t1, what] of [[300, 600, 'drags right'], [1400, 1700, 'drags back']]) {
  draw.moveTo(pt(X(t0), P.y)).lineTo(pt(X(t1), P.y)).lineTo(pt(X(t1), P.bottom.y)).lineTo(pt(X(t0), P.bottom.y)).closePath().style({ fill: 'note', color: 'note', width: 0.5 });
  text(pt(X((t0 + t1) / 2), P.y - 9), what, { size: 11.5, color: 'muted' });
}
for (const [d, lab] of [[4.5, '+4.5°'], [0, '0°'], [-4.5, '−4.5°']]) {
  draw.moveTo(pt(P.x, Y(d))).lineTo(pt(P.right.x, Y(d))).style({ color: 'line', width: 1 });
  text(pt(P.x - 9, Y(d)), lab, { size: 11, color: 'muted', anchor: 'end' });
}
for (const [d, lab] of [[3.4, '+3.4°'], [-3.4, '−3.4°']]) {
  draw.moveTo(pt(P.x - 4, Y(d))).lineTo(pt(P.x + 10, Y(d))).style({ color: 'ink', width: 1.2, dashed: true });
  text(pt(P.x - 9, Y(d)), lab, { size: 11, color: 'muted', anchor: 'end' });
}
for (const t of [0, 300, 600, 1000, 1400, 1700, 2000, 2600]) text(pt(X(t), P.bottom.y + 18), String(t), { size: 11, color: 'muted' });
text(pt(P.right.x, P.bottom.y + 36), 'milliseconds', { size: 11, color: 'muted', anchor: 'end' });
const trace = (vals, style) => { const p = draw.moveTo(pt(X(0), Y(vals[0]))); for (let t = 5; t <= T; t += 5) p.lineTo(pt(X(t), Y(vals[t]))); p.style(style); };
trace(aim, { color: 'ink', width: 1.4, dashed: true });
trace(ang, { color: 'woad', width: 2.2 });

// The three moments that matter, found in the simulation.
const find = (from, to, better) => { let b = from; for (let t = from; t <= to; t++) if (better(ang[t], ang[b])) b = t; return b; };
const deg = d => `${d.toFixed(1).replace('-', '−')}°`;
const peak = find(300, 900, (p, q) => p > q), back = find(600, 1300, (p, q) => p < q), low = find(1400, 2000, (p, q) => p < q);
const note = (t, words, dx, dy, anchor) => { shape('circle', pt(X(t), Y(ang[t])), { size: 6, fill: 'woad', stroke: 'woad' }); text(pt(X(t) + dx, Y(ang[t]) + dy), words, { size: 11.5, color: 'woad', anchor, halo: true }); };
note(peak, `${deg(ang[peak])}, past its aim: the most it turns`, 9, -6, 'start');
note(back, `stopped: back past level, to ${deg(ang[back])}`, 9, 16, 'start');
note(low, `the other way, ${deg(ang[low])}`, 9, 3, 'start');
// The key, under the axis on the left; the playhead and the dot keep time with the card.
const L = pt(P.x, P.bottom.y + 36);
draw.moveTo(L).lineTo(L.right(24)).style({ color: 'ink', width: 1.4, dashed: true }); text(L.right(30), 'the angle it aims at', { size: 11, color: 'muted', anchor: 'start' });
draw.moveTo(L.right(160)).lineTo(L.right(184)).style({ color: 'woad', width: 2.2 }); text(L.right(190), "the card's angle", { size: 11, color: 'muted', anchor: 'start' });

// The motion: one 2.6 s loop, from the same simulation. The still is t = 0: the card at rest,
// the playhead and the dot at the start of the trace.
const loop = { duration: T, iterations: Infinity };
const every = f => Array.from({ length: T / 20 + 1 }, (_, i) => ({ offset: i * 20 / T, ...f(i * 20) }));
animate('card', every(t => ({ translate: [at[t], 0], rotate: ang[t] })), { ...loop, origin: '50% 20%' });
animate('cursor', every(t => ({ translate: [at[t], 0] })), loop);
const head = draw.moveTo(pt(X(0), P.y - 2)).lineTo(pt(X(0), P.bottom.y + 2)).style({ color: 'rust', width: 1.2 });
animate(head, [{ translate: 0 }, { translate: P.w }], loop);
const dot = shape('circle', pt(X(0), Y(0)), { size: 9, fill: 'card', stroke: 'woad', width: 2 });
animate(dot, every(t => ({ translate: [X(t) - X(0), Y(ang[t]) - Y(0)] })), loop);
</script>
</diagram>
