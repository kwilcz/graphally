<svg xmlns="http://www.w3.org/2000/svg" class="graphally" data-source="diagram.html" viewBox="0 0 2202 766" width="2202" height="766" role="img" aria-label="Expense claim approval. Employee: Expense incurred, Submit claim, Correct claim, Rejection notice, Claim rejected, Payment notice, Claim paid; Line manager: Review claim, 3 days, Approved?, Reject claim; Finance: Finance review, Approved?, Reject claim; ERP system: Validate claim, Valid?, Send reminder, Over £1,000?, Schedule payment. Connections: Expense incurred to Submit claim; Submit claim to Validate claim; Validate claim to Valid?; Valid? to Correct claim (no); Correct claim to Submit claim (resubmit); Valid? to Review claim (yes); 3 days to Send reminder; Send reminder sends events to Review claim (reminder); Review claim to Approved?; Approved? to Over £1,000? (yes); Approved? to Reject claim (no); Reject claim sends events to Rejection notice (rejection); Over £1,000? to Schedule payment (≤ £1,000); Over £1,000? to Finance review (&gt; £1,000); Finance review to Approved?; Approved? to Schedule payment (yes); Approved? to Reject claim (no); Reject claim sends events to Rejection notice (rejection); Rejection notice to Claim rejected; Schedule payment sends events to Payment notice (payment); Payment notice to Claim paid">
<style>/* Copyright (c) 2026 Kamil Wilczyński (kwilcz). graphally Use-Only License: see LICENSE. */
/* graphally tokens and text classes. The compiled SVG references these; standalone
   files embed them. A brand theme redefines the tokens and nothing else. */
:root, svg.graphally {
  --ink: #1b2440; --muted: #5d6680; --line: #c8cfdd; --woad: #1f63b6; --rust: #c4391d;
  --teal: #12807a; --green: #2f8f4e; --purple: #6b4fc4; --amber: #b7791f;
  --wash: #eef2f8; --card: #ffffff; --bg: #f6f7fb; --icon-soft: #dbe6f6; --vnet: #e8f1fc; --note: #fff8e6;
  --lane-a: #e7effb; --lane-b: #e5f4ec; --lane-c: #efe9fa; --lane-d: #fbeee2;
}
:root[data-theme="dark"], svg.graphally[data-theme="dark"] {
  --ink: #e3e8f3; --muted: #9aa4bb; --line: #3a445c; --woad: #7cacf0; --rust: #ff7d61;
  --teal: #4fc1b8; --green: #6fcf8f; --purple: #a991f2; --amber: #f0b44c;
  --wash: #1b2234; --card: #141a29; --bg: #0f131e; --icon-soft: #2a3a58; --vnet: #17243a; --note: #2e2816;
  --lane-a: #1b2a44; --lane-b: #19302a; --lane-c: #261f3d; --lane-d: #36271a;
}
.g-title { font: 600 15px Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
.g-subtitle { font: 400 12.5px Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
.g-label { font: 500 13px Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
.g-tile { font: 500 12.5px Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
.g-sub, .g-gsub, .g-edge, .g-key { font: 400 11.5px Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
.g-group { font: 600 12px Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
.g-msg { font: 400 12.5px Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
.g-num { font: 700 10px Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
.g-frag { font: 700 11px Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
