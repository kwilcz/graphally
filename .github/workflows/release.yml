# Attaches the skill as a zip to every published release, for clients that install skills
# by upload (Claude.ai, Claude Desktop).
name: Release skill
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the skill
        run: cd skills && zip -r ../graphally-skill.zip graphally
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" graphally-skill.zip --clobber
