# Every merge into main is a release. The version its pull request set (tools/version.mjs) is
# tagged v<version> and published, with notes from the merged pull requests and the skill
# attached as a zip for clients that install skills by upload (Claude.ai, Claude Desktop).
# A release published by hand gets its zip too.
name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

# One release at a time, none cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          # The tags, to tell whether this version is out already.
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Package the skill
        run: cd skills && zip -qr ../graphally-skill.zip graphally

      # A release made with GITHUB_TOKEN starts no workflow run, so the zip goes up here rather
      # than from the release event.
      - name: Tag and publish the release, unless this version is out already
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/version.mjs --check
          tag="v$(node tools/version.mjs)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" ]; then echo "$tag is this commit already."; exit 0; fi
            # A pull request that was open while another one merged still carries that one's version.
            echo "::error::$tag was released from another commit, so this merge has no version of its own. Open a pull request: its workflow sets the next version, and this change ships with it."
            exit 1
          fi
          gh release create "$tag" graphally-skill.zip --target "$GITHUB_SHA" --title "$tag" --generate-notes

      - name: Attach the zip to a release published by hand
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" graphally-skill.zip --clobber
