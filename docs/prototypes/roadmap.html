<diagram layout=html width=1300 title="Logistics move to AKS: roadmap" subtitle="The plan of samples/plan, built as a roadmap: phases per workstream, quarters and months on top, today marked">
<style>
  .plan { display: grid; position: relative; }
  .head { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; }
  .q { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .06em; padding: 0 8px 4px; }
  .mo { font-size: 11.5px; padding: 5px 8px; background: var(--wash); border-left: 2px solid var(--bg); }
  .lane { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; row-gap: 8px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .lane > b { grid-column: lead; grid-row: 1; font-size: 12.5px; }
  .ph { position: relative; height: 30px; border: 0; color: white; font-size: 11.5px; font-weight: 600; place-items: center start; padding: 0 22px; white-space: nowrap; }
  .ph > span { position: absolute; left: calc(100% + 8px); color: var(--ink); font-weight: 500 }
  .net .ph { background: var(--teal) } .plat .ph { background: var(--woad) } .apps .ph { background: var(--purple) } .sec .ph { background: var(--amber) }
  .ph.done { background: var(--lane-b); color: var(--ink) }
  .ms { align-self: center; height: 24px; justify-self: start; width: max-content; display: flex; align-items: center; gap: 8px; translate: -11px 0; font-size: 12px; font-weight: 600 }
  .ms i { flex: none; width: 22px; height: 22px; min-height: 0; padding: 0; background: var(--rust); border: 0 }
  .today { position: absolute; grid-row: 3 / span 4; top: 0; bottom: 0; left: 0; width: 0 }
</style>
<div class=plan id=plan>
  <div class=head id=quarters></div>
  <div class=head id=months></div>
  <div class="lane net"><b>Network</b>
    <div shape=chevron-start class="ph done" id=hub data-start=2026-01-05 data-end=2026-01-30>Hub VNet and VPN</div>
    <div shape=chevron class=ph id=spoke data-after=hub data-duration=2w><span>Spokes, peering</span></div>
  </div>
  <div class="lane plat"><b>Platform</b>
    <div shape=chevron class=ph id=aks data-after=spoke data-duration=3w>AKS and ingress</div>
    <div shape=chevron class=ph id=pg data-start=2026-02-09 data-duration=4w>PostgreSQL, Service Bus</div>
    <div shape=chevron class=ph id=mon data-after=aks data-duration=2w>Monitoring</div>
  </div>
  <div class="lane apps"><b>Applications</b>
    <div shape=chevron class=ph id=pilot data-after=aks,pg data-duration=3w>Pilot: tracking</div>
    <div shape=chevron class=ph id=rest data-after=pilot data-duration=5w>Remaining services</div>
    <div class=ms id=live data-at=2026-05-25><i shape=diamond></i>Go-live</div>
  </div>
  <div class="lane sec"><b>Security review</b>
    <div shape=chevron class=ph id=pen data-start=2026-05-18 data-duration=1w><span>External pen test</span></div>
  </div>
  <i class=today data-at=2026-03-02></i>
</div>
<script type="graphally" before>
schedule();
const t = timeline('#plan', { from: '2026-01-01', to: '2026-07-01', lead: '130px' });
for (const m of t.months) el('#months').append(make('div', { class: 'mo', style: `grid-column: ${m.column}` }, m.label));
el('#quarters').append(make('div', { class: 'q', style: 'grid-column: m2026-01 / m2026-04' }, 'Q1 2026'), make('div', { class: 'q', style: 'grid-column: m2026-04 / d2026-07-01' }, 'Q2 2026'));
</script>
<script type="graphally">
// Dependencies that cross workstreams; inside one, the phases already touch.
for (const t of all('[data-after]')) for (const d of t.el.dataset.after.split(','))
  if (el(d).el.closest('.lane') !== t.el.closest('.lane')) connect(d, t, { dashed: true, color: 'muted' });
const today = el('.today');
draw.moveTo(today.top).lineTo(today.bottom).style({ color: 'rust', width: 2 });
text(today.bottom.down(12), 'today, 2 March', { size: 11, color: 'rust' });
</script>
</diagram>
