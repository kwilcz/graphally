# Releases every push to main as vMAJOR.N.0, with the skill attached as a zip.
# MAJOR is the only number set by hand; N counts up by itself.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

env:
  MAJOR: 1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags, to number the release
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then echo "already released"; exit 0; fi
          last=$(git tag --list "v$MAJOR.*.*" --sort=-v:refname | head -n1)
          if [ -n "$last" ]; then n=$(( $(echo "$last" | cut -d. -f2) + 1 )); else n=0; fi
          tag="v$MAJOR.$n.0"
          (cd skills && zip -qr ../graphally-skill.zip graphally)
          gh release create "$tag" graphally-skill.zip --target "$GITHUB_SHA" --title "graphally $tag" --generate-notes
