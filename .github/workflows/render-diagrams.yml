# Prepares a pull request into main for release. It sets the version the merge will release
# (tools/version.mjs), chosen by the pull request's label: "build" (the default, also with no
# label), "minor" or "major"; with several, the largest wins. Then it re-renders every diagram under samples/ and docs/diagrams/, so the
# pull request carries SVG and PNG files that match their sources, and rebuilds the viewer
# bundle (graphally.js). A branch of this repository
# gets the files committed back to it. A fork cannot be pushed to, so there the job only fails
# when its diagram files are out of date, and its version is set after the merge.
name: Render diagrams

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: write   # labels belong to the issues API

# A newer run for the same branch replaces an older run that is still going.
concurrency:
  group: render-diagrams-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same-repository PRs and manual runs check out their branch, so the push lands on it.
      - name: Check out the branch
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # The tags and main, to work out the next version.
          fetch-depth: 0

      # A fork's branch is not in this repository, so check out its head commit without credentials.
      - name: Check out the fork's head commit
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Text is measured with the browser's fonts, and the theme names Inter first. Without Inter
      # every render shifts. The runner's stock fontconfig prefers DejaVu for the generic
      # sans-serif, which a few diagrams name, so Inter is made the preference there too.
      - name: Install Inter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter
          mkdir -p ~/.config/fontconfig
          printf '%s\n' '<?xml version="1.0"?>' '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">' \
            '<fontconfig><alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias></fontconfig>' > ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null
          test "$(fc-match -f '%{family}' sans-serif)" = Inter

      # The labels that choose the release, so they can be picked on any pull request.
      - name: Make sure the release labels exist
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create build --color c5def5 --description "Release the next build version (the default)" --force
          gh label create minor --color 1d76db --description "Release the next minor version" --force
          gh label create major --color b60205 --description "Release the next major version: a breaking change" --force

      - name: Set the version this pull request releases
        if: ${{ (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch') && (github.head_ref || github.ref_name) != 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          git fetch --quiet --tags origin main
          # A pull request event carries its labels; a manual run looks its pull request up.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then LABELS=$(gh pr view "$BRANCH" --json labels --jq '[.labels[].name] | join(" ")'); fi
          kind=build
          for l in $LABELS; do
            case "$l" in major) kind=major ;; minor) [ "$kind" = major ] || kind=minor ;; esac
          done
          version=$(node tools/version.mjs --next "$kind")
          echo "This pull request releases $version ($kind)." | tee -a "$GITHUB_STEP_SUMMARY"
          node tools/version.mjs "$version"

      - name: Render every diagram
        run: bash tools/render-diagrams.sh

      - name: Commit the version and the re-rendered files, or fail when they are out of date
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CAN_PUSH: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' }}
        run: |
          git add -A -- ':(glob)samples/**/*.svg' ':(glob)samples/**/*.png' ':(glob)samples/**/*.html' ':(glob)docs/diagrams/*.svg' ':(glob)docs/diagrams/*.png' ':(glob)docs/diagrams/*.html' skills/graphally/viewer/graphally.js \
            skills/graphally/SKILL.md .claude-plugin/plugin.json .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "The version and the diagram files are up to date."
            exit 0
          fi
          msg="Re-render diagrams and the viewer"
          git diff --cached --quiet -- skills/graphally/SKILL.md || msg="Release $(node tools/version.mjs) on merge; re-render diagrams"

          git diff --cached --stat
          # Forks and main never take a push: the job fails and the author re-renders.
          if [ "$CAN_PUSH" != "true" ] || [ "$BRANCH" = "main" ]; then
            echo "::error::The diagram files are out of date. Run bash tools/render-diagrams.sh and commit the result."
            exit 1
          fi
          git config user.name "Kamil Wilczynski"
          git config user.email "25964560+kwilcz@users.noreply.github.com"
          git commit -m "$msg"
          # A push made with GITHUB_TOKEN starts no workflow runs: this commit does not loop back
          # here, and the checks on the branch are not run again for it.
          git push origin "HEAD:refs/heads/$BRANCH"
